[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitranslator"
version = "1.0.0"
description = "Windows için sistem geneli çeviri uygulaması (Alt+B / Alt+N kısayolları)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "keyring>=24",
    "winocr>=0.0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
aitranslator = "aitranslator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
